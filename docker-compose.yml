# Local development services. Not used in production (Render + R2 there).
#   docker compose up -d          # start Postgres + MinIO (R2 stand-in)
#   pnpm db:migrate               # create tables
#   docker compose down           # stop (data kept in volumes; add -v to wipe)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: charly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: charly
      MINIO_ROOT_PASSWORD: charly-dev-secret
    ports:
      - "9000:9000" # S3 API  → S3_ENDPOINT=http://localhost:9000
      - "9001:9001" # web console → http://localhost:9001
    volumes:
      - miniodata:/data

  storage-init:
    image: minio/mc:latest
    depends_on:
      - storage
    entrypoint: >
      sh -c "until mc alias set local http://storage:9000 charly charly-dev-secret; do sleep 1; done;
             mc mb --ignore-existing local/charly-dev"

volumes:
  pgdata:
  miniodata:
